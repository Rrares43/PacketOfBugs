spring.application.name=spring-reddit

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

spring.docker.compose.enabled=false

# JWT Configuration
jwt.secret=yourSuperSecretKeyHereThatIsAtLeast256BitsLong1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Accepted uploads never spill to the EC2 disk; servlet Parts are explicitly deleted in PostController.
spring.servlet.multipart.file-size-threshold=5MB
aws.s3.region=eu-central-1
aws.s3.bucket-name=packet-of-bugs-eu
aws.credentials.access-key=${AWS_ACCESS_KEY}
aws.credentials.secret-key=${AWS_SECRET_KEY}

# File edit
filter.api.url=http://localhost:5000/api/filter

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

logging.level.root=WARN
logging.level.com.example.springreddit=INFO

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# Google Gemini AI Key
gemini.api.key=${GEMINI_API_KEY}
